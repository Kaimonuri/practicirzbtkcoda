<!DOCTYPE html>
<html>
<head>
    <title>Todo List</title>

    <style>
        body{
            font-family: Arial;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            padding-top:50px;
        }

        .card{
            width:500px;
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 0 15px rgba(0,0,0,.1);
        }

        h1{
            text-align:center;
        }

        ul{
            list-style:none;
            padding:0;
        }

        li{
            display:flex;
            justify-content:space-between;
            margin-bottom:10px;
            background:#eee;
            padding:10px;
            border-radius:8px;
        }

        input[type=text]{
            width:70%;
            padding:8px;
        }

        button{
            padding:8px 12px;
            cursor:pointer;
        }
    </style>
</head>

<body>

<div class="card">

<h1>My To Do List</h1>

<form action="/addTodoItem/" method="post">
    {% csrf_token %}

    <input
        type="text"
        name="content"
        placeholder="Новая задача"
    >

    <button type="submit">
        Добавить
    </button>
</form>

<hr>

<ul>

{% for i in all_items %}

<li>

    {{ i.content }}

    <form
        action="/deleteTodoItem/{{i.id}}/"
        method="post"
    >
        {% csrf_token %}

        <button type="submit">
            Удалить
        </button>

    </form>

</li>

{% endfor %}

</ul>

</div>

</body>
</html>
